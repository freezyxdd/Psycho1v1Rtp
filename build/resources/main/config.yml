# ============================================
#               1v1 Plugin
# ============================================

# ============================================
# Settings
# ============================================

settings:
  # If true, player must wear full armor to join queue
  require-full-armor: true

  # Random teleport radius in blocks from the selected world's spawn
  teleport-radius: 5000

  # World selection for 1v1 matches
  world-selection:
    # If true, selects a random world from the worlds list
    random-world: false

    # Used when random-world is false
    default-word: "world"

    # Worlds available for random selection
    worlds:
      - "world"
      - "newworld"
      - "test"

  # If true, players will be teleported apart and facing each other
  face-to-face:
    enabled: true
    distance: 10.0#


