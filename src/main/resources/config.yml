# Psycho1v1Rtp

# Available: en, pt_BR
language: "en"

settings:
  # Require full armor to join the queue
  require-full-armor: true

  # RTP radius from the selected world's spawn
  teleport-radius: 5000

  world-selection:
    # false = use default-world
    # true = choose a random world from the list
    random-world: false
    default-world: "world"

    worlds:
      - "world"
      - "newworld"
      - "test"

  # Players are always separated by distance.
  # If enabled, they will also face each other.
  face-to-face:
    enabled: true
    distance: 10.0

sounds:
  searching:
    sound: "ui.button.click"
    volume: 1.0
    pitch: 1.0

  cancelled:
    sound: "entity.item.break"
    volume: 1.0
    pitch: 1.0

  found:
    sound: "entity.ender_dragon.growl"
    volume: 1.0
    pitch: 1.0

  error:
    sound: "entity.item.break"
    volume: 1.0
    pitch: 1.2

# Messages are in languages/en.yml and languages/pt_BR.yml
# Use /ps1v1 reload after changing the config or language files.
