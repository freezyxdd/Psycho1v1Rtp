# ============================================
#               1v1RtpQueue
# ============================================

# Available bundled languages:
# - en
# - pt_BR
language: "en"

settings:
  # If true, players must wear full armor to join the queue.
  require-full-armor: true

  # Random teleport radius in blocks from the selected world's spawn.
  teleport-radius: 5000

  # World selection for 1v1 matches.
  world-selection:
    # If true, selects a random loaded world from the list below.
    random-world: false

    # Used when random-world is false.
    default-world: "world"

    # Worlds available for random selection.
    worlds:
      - "world"
      - "newworld"
      - "test"

  # Players are always placed apart using this distance.
  # If enabled is true, they will also face each other.
  face-to-face:
    enabled: true
    distance: 10.0

# ============================================
# Sounds
# Minecraft namespaced sound keys are supported.
# ============================================
sounds:
  searching:
    sound: "ui.button.click"
    volume: 1.0
    pitch: 1.0

  cancelled:
    sound: "entity.item.break"
    volume: 1.0
    pitch: 1.0

  found:
    sound: "entity.ender_dragon.growl"
    volume: 1.0
    pitch: 1.0

  error:
    sound: "entity.item.break"
    volume: 1.0
    pitch: 1.2
